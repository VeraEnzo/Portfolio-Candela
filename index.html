<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candela Merás — Diseñadora de Indumentaria</title>
  <meta name="description" content="Portfolio de Candela Merás, diseñadora de indumentaria argentina y creadora de Meiri Doll. Colecciones, moldería, estilismo y marca propia." />
  <meta name="theme-color" content="#FDF8F2" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' x='50' text-anchor='middle' font-size='90' fill='%238B2635'%3E✦%3C/text%3E%3C/svg%3E" />
  <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.). Si cambia el dominio, actualizar estas URLs. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:title" content="Candela Merás — Diseñadora de Indumentaria" />
  <meta property="og:description" content="Colecciones, moldería, estilismo y marca propia. Creadora de Meiri Doll." />
  <meta property="og:url" content="https://candelameras.vercel.app/" />
  <meta property="og:image" content="https://candelameras.vercel.app/images/og-image.jpg?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #F2C4C0;
      --rose-light: #FAE4E2;
      --rose-pale: #FDF0EF;
      --cream: #FDF8F2;
      --cream-warm: #FAF3EA;
      --burgundy: #8B2635;
      --burgundy-soft: #A63245;
      --muted: #7A3F3A;
      --ink-rose: #5C2530;
      --white: #FFFCFA;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink-rose);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* Cursor (solo con mouse; ver JS) */
    body.custom-cursor, body.custom-cursor a, body.custom-cursor button { cursor: none; }
    .cursor, .cursor-ring { display: none; }
    body.custom-cursor .cursor, body.custom-cursor .cursor-ring { display: block; }
    .cursor {
      width: 8px; height: 8px;
      background: var(--burgundy);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-ring {
      width: 28px; height: 28px;
      border: 1px solid var(--burgundy);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      opacity: 0.35;
      transition: left 0.18s ease, top 0.18s ease;
    }

    /* Grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 8000;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 3.5rem;
      background: rgba(253, 248, 242, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(139, 38, 53, 0.1);
    }

    .nav-logo {
      font-family: 'Pinyon Script', cursive;
      font-size: 1.7rem;
      color: var(--burgundy);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
      font-weight: 400;
    }
    .nav-links a:hover { color: var(--burgundy); }

    /* HERO */
    #hero {
      min-height: 100vh;
      background: var(--rose-pale);
      display: grid;
      grid-template-columns: 45fr 55fr; /* más espacio para las fotos */
      position: relative;
      overflow: hidden;
    }

    #hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242,196,192,0.55) 0%, transparent 70%);
      top: -100px; left: -100px;
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,38,53,0.08) 0%, transparent 70%);
      bottom: 0; right: 30%;
      pointer-events: none;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 9rem clamp(2rem, 5vw, 7rem) 5rem;
      position: relative;
      z-index: 1;
    }
    .hero-content { width: fit-content; max-width: 100%; }

    .hero-eyebrow {
      font-size: clamp(0.65rem, 0.75vw, 0.78rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .hero-name {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(4rem, 7.4vw, 10rem);
      color: var(--burgundy);
      line-height: 1.05;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.35s forwards;
      text-shadow: 0 2px 20px rgba(139,38,53,0.12);
    }

    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 1.35vw, 1.45rem);
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 1rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.65s forwards;
    }
    .hero-divider::before, .hero-divider::after {
      content: '';
      flex: 1;
      max-width: 56px;
      height: 1px;
      background: var(--rose);
    }
    .hero-divider span {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hero-desc {
      font-size: clamp(0.88rem, 1vw, 1.08rem);
      line-height: 1.9;
      color: var(--muted);
      max-width: 30rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.8s forwards;
    }

    .hero-scroll {
      margin-top: 3rem;
      font-size: clamp(0.62rem, 0.7vw, 0.72rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.9s ease 1s forwards;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .hero-scroll::before {
      content: '';
      width: 30px; height: 1px;
      background: var(--muted);
      display: block;
    }

    .hero-right {
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, var(--rose-light) 0%, var(--rose) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-photo-wrap {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* CARRUSEL HERO */
    .hero-carousel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .hero-carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .hero-carousel-slide.active { opacity: 1; }

    .hero-carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .carousel-dots {
      position: absolute;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 2;
    }

    .carousel-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(253,248,242,0.5);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.3s;
    }
    .carousel-dot.active { background: var(--white); }

    /* SOBRE MI */
    #sobre-mi {
      background: var(--cream);
      padding: 8rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 6rem;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .about-ornament {
      text-align: center;
    }

    .about-initial {
      font-family: 'Pinyon Script', cursive;
      font-size: 14rem;
      line-height: 1;
      color: var(--burgundy-soft);
      display: block;
      user-select: none;
    }

    .about-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-top: -1rem;
    }

    .section-label {
      font-size: 0.62rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .section-label::before {
      content: '✦';
      font-size: 0.5rem;
      color: var(--burgundy);
    }

    .about-text h2 {
      font-family: 'Pinyon Script', cursive;
      font-size: 3.2rem;
      color: var(--burgundy);
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .about-text p {
      font-size: 0.9rem;
      line-height: 1.9;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* PROYECTOS */
    #proyectos {
      background: var(--rose-pale);
      padding: 6rem 0 8rem;
    }

    .proyectos-header {
      text-align: center;
      padding: 0 3rem 5rem;
    }

    .proyectos-header h2 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(3rem, 5vw, 5rem);
      color: var(--burgundy);
      line-height: 1.1;
    }

    .proyectos-header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .project-block {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 3rem;
      scroll-margin-top: 6rem;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .project-block.visible { opacity: 1; transform: none; }

    .project-header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 2.5rem;
      align-items: start;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(242,196,192,0.6);
      cursor: pointer;
      list-style: none;
    }
    .project-header::-webkit-details-marker { display: none; }
    .project-header:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 6px; }
    .project[open] .project-header { margin-bottom: 2.5rem; }
    .project-header:hover .project-title { color: var(--burgundy-soft); }

    /* Miniaturas de vista previa (solo con el proyecto cerrado) */
    .project-preview {
      display: flex;
      gap: 6px;
      margin-top: 1.2rem;
    }
    .project-preview img {
      width: 64px;
      height: 84px;
      object-fit: cover;
      background: var(--rose-light);
      border-radius: 2px;
    }
    .project[open] .project-preview { display: none; }

    .project-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.2rem;
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--burgundy);
      font-weight: 400;
    }
    .project-toggle .chev {
      display: inline-block;
      width: 7px; height: 7px;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
      transition: transform 0.3s ease;
    }
    .project[open] .project-toggle .chev { transform: translateY(2px) rotate(-135deg); }
    .project-toggle .when-open { display: none; }
    .project[open] .project-toggle .when-open { display: inline; }
    .project[open] .project-toggle .when-closed { display: none; }
    .project-sections { overflow: hidden; }

    .project-number {
      font-family: 'Pinyon Script', cursive;
      font-size: 5rem;
      line-height: 0.85;
      color: var(--burgundy-soft);
      user-select: none;
    }

    .project-tag {
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .project-title {
      font-family: 'Pinyon Script', cursive;
      font-size: 2.8rem;
      color: var(--burgundy);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .project-desc {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 520px;
    }

    .project-sections {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .project-section-block {
      background: var(--white);
      border: 1px solid rgba(242,196,192,0.5);
      padding: 2rem 2.2rem;
      border-radius: 2px;
    }

    .project-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--burgundy);
      font-weight: 400;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .project-section-title::before {
      content: '';
      display: block;
      width: 16px; height: 1px;
      background: var(--rose);
    }

    /* Photo grids */
    .photo-grid {
      display: grid;
      gap: 8px;
    }
    .photo-grid.cols-1 { grid-template-columns: 1fr; }
    .photo-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    .photo-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .photo-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

    .photo {
      aspect-ratio: 3/4;
      background: var(--rose-pale);
      position: relative;
      overflow: hidden;
      padding: 0;
      border: none;
      cursor: zoom-in;
      display: block;
      width: 100%;
    }
    .photo.horizontal { aspect-ratio: 4/3; }
    .photo.cuadrado { aspect-ratio: 1; }
    .photo.panoramico { aspect-ratio: 16/7; }

    .photo img, .photo video {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .photo:hover img, .photo:hover video { transform: scale(1.04); }
    .video-badge {
      position: absolute;
      right: 8px; bottom: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(253,248,242,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .video-badge::before {
      content: '';
      margin-left: 2px;
      border-left: 8px solid var(--burgundy);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .photo:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 2px; }

    .script-em {
      font-family: 'Pinyon Script', cursive;
      font-size: 1.4rem;
      color: var(--burgundy);
      font-style: normal;
    }

    .load-error {
      text-align: center;
      padding: 4rem 2rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--muted);
    }

    .ornament-sep {
      text-align: center;
      margin: 2.5rem 0 3rem;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.5em;
    }

    .project-block.featured .project-section-block {
      background: var(--cream-warm);
      border-color: rgba(139,38,53,0.12);
    }
    .project-block.featured .project-title { color: var(--burgundy); }

    /* CONTACTO */
    #contacto {
      background: var(--cream);
      padding: 8rem 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #contacto::before {
      content: '✦';
      position: absolute;
      font-size: 30rem;
      color: rgba(242,196,192,0.15);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      line-height: 1;
    }

    .contact-inner { position: relative; z-index: 1; }

    #contacto h2 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(3rem, 5vw, 5rem);
      color: var(--burgundy);
      margin-bottom: 0.5rem;
    }

    #contacto .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    .contact-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2.5rem;
    }

    .contact-link {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--burgundy);
      text-decoration: none;
      padding: 0.85rem 2rem;
      border: 1px solid rgba(139,38,53,0.3);
      transition: background 0.3s, border-color 0.3s;
      background: transparent;
    }
    .contact-link:hover {
      background: var(--rose-light);
      border-color: var(--rose);
    }
    .contact-link.primary {
      background: var(--burgundy);
      color: var(--cream);
      border-color: var(--burgundy);
    }
    .contact-link.primary:hover {
      background: var(--ink-rose);
      border-color: var(--ink-rose);
    }

    /* FOOTER */
    footer {
      background: var(--rose-pale);
      border-top: 1px solid rgba(242,196,192,0.6);
      padding: 2rem 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer span {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer a {
      font-family: 'Pinyon Script', cursive;
      font-size: 1.3rem;
      color: var(--burgundy);
      text-decoration: none;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(30, 10, 12, 0.92);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }
    .lightbox img, .lightbox video {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 8px 60px rgba(0,0,0,0.6);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .lightbox.open img, .lightbox.open video { transform: scale(1); }
    .lightbox [hidden] { display: none; }
    .lightbox-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--rose-light);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--rose-light);
      font-size: 2.4rem;
      padding: 1rem;
      cursor: pointer;
      opacity: 0.7;
      line-height: 1;
      transition: opacity 0.2s;
    }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-nav[hidden] { display: none; }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      #hero { grid-template-columns: 1fr; }
      .hero-right { min-height: 55vw; }
      .hero-left { padding: 8rem 2rem 3rem; }
      nav { padding: 1rem 1.5rem; }
      .nav-links { gap: 1.2rem; }
      #sobre-mi { grid-template-columns: 1fr; gap: 2rem; padding: 5rem 2rem; }
      .about-initial { font-size: 9rem; }
      .project-block { padding: 0 1.5rem; }
      .photo-grid.cols-3 { grid-template-columns: 1fr 1fr; }
      .photo-grid.cols-4 { grid-template-columns: 1fr 1fr; }
      footer { flex-direction: column; gap: 0.8rem; text-align: center; }
      .project-section-block { padding: 1.4rem 1.2rem; }
      .lightbox-nav { font-size: 2rem; padding: 0.6rem; }
    }

    @media (max-width: 480px) {
      nav { padding: 0.9rem 1rem; }
      .nav-logo { font-size: 1.4rem; }
      .nav-links { gap: 0.9rem; }
      .nav-links a { font-size: 0.6rem; letter-spacing: 0.14em; }
      .project-header { grid-template-columns: 1fr; }
      .project-number { display: none; }
      .project-title { font-size: 2.3rem; }
      .project-preview img { width: 54px; height: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .project-block { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- NAV -->
  <nav aria-label="Principal">
    <a href="#hero" class="nav-logo" data-bind="portada.nombre">Candela Merás</a>
    <ul class="nav-links">
      <li><a href="#sobre-mi">Sobre mí</a></li>
      <li><a href="#proyectos">Proyectos</a></li>
      <li><a href="#contacto">Contacto</a></li>
    </ul>
  </nav>

  <main>
    <!-- HERO -->
    <section id="hero">
      <div class="hero-left">
        <div class="hero-content">
        <p class="hero-eyebrow" data-bind="portada.etiqueta"></p>
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-subtitle" data-bind="portada.subtitulo"></p>
        <div class="hero-divider" aria-hidden="true"><span>✦</span></div>
        <p class="hero-desc" data-bind="portada.descripcion"></p>
        <p class="hero-scroll">desplazá para explorar</p>
        </div>
      </div>
      <div class="hero-right">
        <div class="hero-carousel" id="heroCarousel" aria-roledescription="carrusel" aria-label="Fotos de trabajo"></div>
      </div>
    </section>

    <!-- SOBRE MÍ -->
    <section id="sobre-mi">
      <div class="about-ornament" aria-hidden="true">
        <span class="about-initial" id="aboutInitial">C</span>
        <p class="about-tagline" data-bind="sobre_mi.frase"></p>
      </div>
      <div class="about-text">
        <p class="section-label">Sobre mí</p>
        <h2 data-bind="sobre_mi.titulo"></h2>
        <div id="aboutText"></div>
      </div>
    </section>

    <!-- PROYECTOS -->
    <section id="proyectos">
      <div class="proyectos-header">
        <p class="section-label" style="justify-content:center">Trayectoria</p>
        <h2 data-bind="proyectos_intro.titulo"></h2>
        <p data-bind="proyectos_intro.subtitulo"></p>
      </div>
      <div id="projectList"></div>
    </section>

    <!-- CONTACTO -->
    <section id="contacto">
      <div class="contact-inner">
        <p class="section-label" style="justify-content:center">Hablemos</p>
        <h2 data-bind="contacto.titulo"></h2>
        <p class="sub" data-bind="contacto.subtitulo"></p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>© <span id="year"></span> <span data-bind="portada.nombre"></span></span>
    <a href="#hero" data-bind="portada.nombre"></a>
    <span>Diseñadora de Indumentaria</span>
  </footer>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" aria-hidden="true">
    <button class="lightbox-close" aria-label="Cerrar">✕</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Foto anterior">‹</button>
    <img id="lightboxImg" src="" alt="" />
    <video id="lightboxVideo" controls loop playsinline hidden></video>
    <button class="lightbox-nav lightbox-next" aria-label="Foto siguiente">›</button>
  </div>

  <script>
    // ---------- Utilidades ----------
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Las rutas del CMS empiezan con "/"; se vuelven relativas para que el sitio funcione en cualquier ruta
    const src = p => esc(String(p || '').replace(/^\/+/, ''));
    const get = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
    // Texto con párrafos (línea en blanco) y *énfasis* en letra caligráfica
    const richText = t => String(t || '').split(/\n\s*\n/).filter(p => p.trim())
      .map(p => '<p>' + esc(p.trim()).replace(/\*(.+?)\*/g, '<em class="script-em">$1</em>').replace(/\n/g, '<br>') + '</p>').join('');

    const FORMATOS = ['vertical', 'horizontal', 'cuadrado', 'panoramico'];

    async function loadJSON(url) {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(url + ': ' + res.status);
      return res.json();
    }

    // ---------- Render ----------
    function renderGeneral(g) {
      document.querySelectorAll('[data-bind]').forEach(el => {
        const v = get(g, el.dataset.bind);
        if (v != null) el.textContent = v;
      });

      const nombre = (g.portada?.nombre || '').trim();
      const partes = nombre.split(/\s+/);
      document.getElementById('heroName').innerHTML = partes.length > 1
        ? esc(partes[0]) + '<br>' + esc(partes.slice(1).join(' '))
        : esc(nombre);
      document.getElementById('aboutInitial').textContent = nombre.charAt(0) || 'C';
      document.getElementById('aboutText').innerHTML = richText(g.sobre_mi?.texto);

      renderCarousel(g.portada?.fotos || [], nombre);

      const c = g.contacto || {};
      const links = [];
      if (c.email) links.push(`<a href="mailto:${esc(c.email)}" class="contact-link primary">Enviar mail</a>`);
      if (c.instagram) links.push(`<a href="https://instagram.com/${esc(c.instagram.replace(/^@/, ''))}" target="_blank" rel="noopener" class="contact-link">Instagram</a>`);
      if (c.whatsapp) links.push(`<a href="https://wa.me/${esc(String(c.whatsapp).replace(/\D/g, ''))}" target="_blank" rel="noopener" class="contact-link">WhatsApp</a>`);
      document.getElementById('contactLinks').innerHTML = links.join('');
    }

    const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slugify = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'proyecto';

    function renderProjects(data) {
      const visibles = (data.proyectos || []).filter(p => p.visible !== false);
      const usados = new Set();
      const html = visibles.map((p, i) => {
        let id = slugify(p.titulo);
        while (usados.has(id)) id += '-2';
        usados.add(id);

        const secciones = (p.secciones || []).filter(s => (s.fotos || []).length || (s.videos || []).length);
        const bloques = secciones.map(s => {
          const cols = Math.min(Math.max(parseInt(s.columnas, 10) || 3, 1), 4);
          const formato = FORMATOS.includes(s.formato) ? s.formato : 'vertical';
          const fotos = (s.fotos || []).map((f, n) => {
            const alt = `${p.titulo} — ${s.titulo} (${n + 1})`;
            return `<button type="button" class="photo ${formato}" aria-label="Ampliar: ${esc(alt)}"><img src="${src(f)}" alt="${esc(alt)}" loading="lazy" decoding="async" /></button>`;
          }).join('');
          const videos = (s.videos || []).map((v, n) => {
            const label = `${p.titulo} — ${s.titulo} (video ${n + 1})`;
            return `<button type="button" class="photo ${formato}" aria-label="Ver video: ${esc(label)}"><video data-src="${src(v)}" muted loop playsinline preload="none" aria-hidden="true"></video><span class="video-badge" aria-hidden="true"></span></button>`;
          }).join('');
          return `<div class="project-section-block">
              <h4 class="project-section-title">${esc(s.titulo)}</h4>
              <div class="photo-grid cols-${cols}">${fotos}${videos}</div>
            </div>`;
        }).join('');

        // Miniaturas: las primeras 4 fotos del proyecto (se ven solo con el proyecto cerrado)
        const preview = secciones.flatMap(s => s.fotos || []).slice(0, 4)
          .map(f => `<img src="${src(f)}" alt="" loading="lazy" decoding="async" />`).join('');

        const sep = i < visibles.length - 1 ? '<div class="ornament-sep" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</div>' : '';
        return `<article class="project-block${p.destacado ? ' featured' : ''}" id="${esc(id)}">
            <details class="project">
              <summary class="project-header">
                <div class="project-number" aria-hidden="true">✦</div>
                <div class="project-meta">
                  <p class="project-tag">${esc(p.etiqueta)}</p>
                  <h3 class="project-title">${esc(p.titulo)}</h3>
                  <p class="project-desc">${esc(p.descripcion)}</p>
                  ${preview ? `<div class="project-preview" aria-hidden="true">${preview}</div>` : ''}
                  <span class="project-toggle"><span class="when-closed">Ver proyecto</span><span class="when-open">Cerrar</span><span class="chev" aria-hidden="true"></span></span>
                </div>
              </summary>
              <div class="project-sections">${bloques}</div>
            </details>
          </article>${sep}`;
      }).join('');
      document.getElementById('projectList').innerHTML = html;

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
        });
      }, { threshold: 0, rootMargin: '0px 0px -10% 0px' }); // threshold 0: los proyectos muy largos nunca llegarían a un % alto
      document.querySelectorAll('.project-block').forEach(el => observer.observe(el));

      document.querySelectorAll('.project').forEach(setupToggle);
      document.querySelectorAll('.photo video').forEach(v => videoObserver.observe(v));
      openFromHash();
    }

    // ---------- Proyectos desplegables ----------
    function setupToggle(details) {
      const summary = details.querySelector('summary');
      summary.addEventListener('click', e => {
        e.preventDefault();
        const abrir = !details.open;
        setOpen(details, abrir, true);
        // El link del navegador apunta al proyecto abierto (para compartirlo)
        history.replaceState(null, '', abrir ? '#' + details.parentElement.id : location.pathname + location.search);
      });
    }

    function setOpen(details, abrir, animar) {
      const body = details.querySelector('.project-sections');
      body.getAnimations().forEach(a => a.cancel());
      if (abrir) {
        details.open = true;
        if (animar && !REDUCED_MOTION) body.animate(
          [{ height: '0px', opacity: 0 }, { height: body.scrollHeight + 'px', opacity: 1 }],
          { duration: 450, easing: 'ease' });
      } else {
        // Si el encabezado quedó arriba de la pantalla, volver a él al cerrar
        const header = details.parentElement;
        if (header.getBoundingClientRect().top < 0) header.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
        if (!animar || REDUCED_MOTION) { details.open = false; return; }
        body.animate(
          [{ height: body.scrollHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }],
          { duration: 350, easing: 'ease' }).onfinish = () => { details.open = false; };
      }
    }

    function openFromHash() {
      const id = decodeURIComponent(location.hash.slice(1));
      const block = id && document.getElementById(id);
      const details = block && block.querySelector('.project');
      if (!details) return;
      setOpen(details, true, false);
      block.classList.add('visible');
      block.scrollIntoView();
    }
    window.addEventListener('hashchange', openFromHash);

    // ---------- Videos: se reproducen solos, sin sonido, solo mientras se ven ----------
    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(({ target: v, isIntersecting }) => {
        if (isIntersecting) {
          if (!v.src) {
            v.src = v.dataset.src + (REDUCED_MOTION ? '#t=0.1' : '');
            v.preload = REDUCED_MOTION ? 'metadata' : 'auto';
          }
          if (!REDUCED_MOTION) v.play().catch(() => {});
        } else if (!v.paused) {
          v.pause();
        }
      });
    }, { rootMargin: '200px 0px' });

    // ---------- Carrusel ----------
    let carouselTimer = null;
    function renderCarousel(fotos, nombre) {
      const el = document.getElementById('heroCarousel');
      if (!fotos.length) { el.innerHTML = ''; return; }
      el.innerHTML = fotos.map((f, i) =>
        `<div class="hero-carousel-slide${i === 0 ? ' active' : ''}" aria-hidden="${i !== 0}"><img src="${src(f)}" alt="${esc(nombre)} — trabajo ${i + 1}" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} /></div>`
      ).join('') + (fotos.length > 1 ? `<div class="carousel-dots">${fotos.map((_, i) =>
        `<button class="carousel-dot${i === 0 ? ' active' : ''}" data-slide="${i}" aria-label="Ver foto ${i + 1}"${i === 0 ? ' aria-current="true"' : ''}></button>`).join('')}</div>` : '');

      const slides = el.querySelectorAll('.hero-carousel-slide');
      const dots = el.querySelectorAll('.carousel-dot');
      let current = 0;
      const goTo = n => {
        slides[current].classList.remove('active'); slides[current].setAttribute('aria-hidden', 'true');
        dots[current]?.classList.remove('active'); dots[current]?.removeAttribute('aria-current');
        current = n;
        slides[current].classList.add('active'); slides[current].setAttribute('aria-hidden', 'false');
        dots[current]?.classList.add('active'); dots[current]?.setAttribute('aria-current', 'true');
      };
      const start = () => {
        clearInterval(carouselTimer);
        if (slides.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          carouselTimer = setInterval(() => goTo((current + 1) % slides.length), 4000);
      };
      dots.forEach(d => d.addEventListener('click', () => { goTo(+d.dataset.slide); start(); }));
      start();
    }

    // ---------- Lightbox ----------
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const prevBtn = lightbox.querySelector('.lightbox-prev');
    const nextBtn = lightbox.querySelector('.lightbox-next');
    let group = [], idx = 0, lastFocus = null;

    function stopLightboxVideo() {
      lightboxVideo.pause();
      lightboxVideo.removeAttribute('src');
      lightboxVideo.load();
    }
    function showPhoto(i) {
      idx = (i + group.length) % group.length;
      const item = group[idx];
      const video = item.querySelector('video');
      if (video) {
        lightboxImg.hidden = true;
        lightboxImg.removeAttribute('src');
        lightboxVideo.hidden = false;
        lightboxVideo.src = video.dataset.src;
        lightboxVideo.setAttribute('aria-label', item.getAttribute('aria-label').replace(/^Ver video: /, ''));
        lightboxVideo.play().catch(() => {});
      } else {
        stopLightboxVideo();
        lightboxVideo.hidden = true;
        const img = item.querySelector('img');
        lightboxImg.hidden = false;
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
      }
      prevBtn.hidden = nextBtn.hidden = group.length < 2;
    }
    function openLightbox(btn) {
      group = [...btn.closest('.photo-grid').querySelectorAll('.photo')];
      lastFocus = document.activeElement;
      showPhoto(group.indexOf(btn));
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      lightbox.querySelector('.lightbox-close').focus();
    }
    function closeLightbox() {
      if (!lightbox.classList.contains('open')) return;
      stopLightboxVideo();
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lastFocus?.focus();
    }

    document.getElementById('projectList').addEventListener('click', e => {
      const btn = e.target.closest('.photo');
      if (btn) openLightbox(btn);
    });
    prevBtn.addEventListener('click', () => showPhoto(idx - 1));
    nextBtn.addEventListener('click', () => showPhoto(idx + 1));
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox || e.target.classList.contains('lightbox-close')) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPhoto(idx - 1);
      if (e.key === 'ArrowRight') showPhoto(idx + 1);
    });
    // Deslizar con el dedo en el celular
    let touchX = null;
    lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      if (touchX == null || group.length < 2) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) showPhoto(idx + (dx < 0 ? 1 : -1));
      touchX = null;
    });

    // ---------- Cursor personalizado (solo mouse, sin "reducir movimiento") ----------
    if (matchMedia('(hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.body.classList.add('custom-cursor');
      const cursor = document.getElementById('cursor');
      const ring = document.getElementById('cursorRing');
      document.addEventListener('mousemove', e => {
        cursor.style.left = ring.style.left = e.clientX + 'px';
        cursor.style.top = ring.style.top = e.clientY + 'px';
      });
    }

    document.getElementById('year').textContent = new Date().getFullYear();

    // ---------- Carga del contenido ----------
    Promise.all([loadJSON('content/general.json'), loadJSON('content/proyectos.json')])
      .then(([general, proyectos]) => { renderGeneral(general); renderProjects(proyectos); })
      .catch(err => {
        console.error(err);
        document.getElementById('projectList').innerHTML =
          '<p class="load-error">No se pudo cargar el contenido. Si abriste el archivo directamente, levantá un servidor local (ver README).</p>';
      });
  </script>
</body>
</html>
